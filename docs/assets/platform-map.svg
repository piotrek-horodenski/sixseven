<svg viewBox="0 0 920 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#64748b"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#4ade80"/>
    </marker>
    <marker id="arrA" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="920" height="560" fill="#0f172a"/>
  <text x="460" y="36" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="600">sixseven — mapa pomysłu</text>
  <text x="460" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">platforma prowadzi mecz i strzeże sekretu · logika gry działa na infrastrukturze dewelopera</text>

  <!-- ==================== GRACZE ==================== -->
  <g transform="translate(36,120)">
    <rect x="0" y="0" width="96" height="170" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="10" y="12" width="76" height="122" rx="6" fill="#0f172a"/>
    <circle cx="48" cy="26" r="8" fill="#1e88e5"/>
    <rect x="20" y="42" width="56" height="6" rx="3" fill="#334155"/>
    <rect x="20" y="54" width="40" height="6" rx="3" fill="#334155"/>
    <rect x="20" y="76" width="56" height="48" rx="4" fill="#14532d"/>
    <text x="48" y="103" text-anchor="middle" fill="#bbf7d0" font-size="9">aplikacja gry</text>
    <circle cx="48" cy="150" r="7" fill="none" stroke="#475569" stroke-width="2"/>
    <text x="48" y="192" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Gracz A</text>
  </g>
  <g transform="translate(36,330)">
    <rect x="0" y="0" width="96" height="170" rx="14" fill="#1e293b" stroke="#e53935" stroke-width="1.5"/>
    <rect x="10" y="12" width="76" height="122" rx="6" fill="#0f172a"/>
    <circle cx="48" cy="26" r="8" fill="#e53935"/>
    <rect x="20" y="42" width="56" height="6" rx="3" fill="#334155"/>
    <rect x="20" y="54" width="40" height="6" rx="3" fill="#334155"/>
    <rect x="20" y="76" width="56" height="48" rx="4" fill="#14532d"/>
    <text x="48" y="103" text-anchor="middle" fill="#bbf7d0" font-size="9">aplikacja gry</text>
    <circle cx="48" cy="150" r="7" fill="none" stroke="#475569" stroke-width="2"/>
    <text x="48" y="192" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Gracz B</text>
  </g>

  <!-- ==================== PLATFORMA ==================== -->
  <rect x="218" y="92" width="416" height="424" rx="18" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="426" y="118" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">platforma sixseven</text>

  <!-- gate -->
  <g transform="translate(250,150)">
    <rect width="130" height="120" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="65" y="30" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="700">gate</text>
    <text x="65" y="52" text-anchor="middle" fill="#94a3b8" font-size="10">auth · tokeny</text>
    <text x="65" y="68" text-anchor="middle" fill="#94a3b8" font-size="10">subskrypcje kolekcji</text>
    <text x="65" y="84" text-anchor="middle" fill="#94a3b8" font-size="10">(polityki row-level)</text>
    <text x="65" y="100" text-anchor="middle" fill="#94a3b8" font-size="10">proxy komend</text>
  </g>

  <!-- games (skarbiec) -->
  <g transform="translate(452,150)">
    <rect width="156" height="150" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="78" y="28" text-anchor="middle" fill="#fbbf24" font-size="15" font-weight="700">games</text>
    <text x="78" y="48" text-anchor="middle" fill="#94a3b8" font-size="10">silnik tur · matchmaking</text>
    <text x="78" y="63" text-anchor="middle" fill="#94a3b8" font-size="10">rating · zaufanie</text>
    <!-- kłódka: sekret -->
    <g transform="translate(48,76)">
      <rect x="0" y="14" width="60" height="42" rx="7" fill="#78350f" stroke="#fbbf24" stroke-width="2"/>
      <path d="M14,14 v-6 a16,16 0 0 1 32,0 v6" fill="none" stroke="#fbbf24" stroke-width="3.5"/>
      <circle cx="30" cy="32" r="5" fill="#fbbf24"/>
      <rect x="27.5" y="34" width="5" height="10" rx="2" fill="#fbbf24"/>
    </g>
    <text x="78" y="144" text-anchor="middle" fill="#fde68a" font-size="9.5">ruchy — sekret do reveal</text>
  </g>

  <!-- mongo -->
  <g transform="translate(250,340)">
    <path d="M0,14 a65,14 0 0 1 130,0 v66 a65,14 0 0 1 -130,0 Z" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
    <ellipse cx="65" cy="14" rx="65" ry="14" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
    <text x="65" y="48" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="700">Mongo RS ×3</text>
    <text x="65" y="66" text-anchor="middle" fill="#94a3b8" font-size="9.5">matches · match_views</text>
    <text x="65" y="80" text-anchor="middle" fill="#94a3b8" font-size="9.5">match_events · trust_events</text>
  </g>

  <!-- judge -->
  <g transform="translate(452,352)">
    <rect width="156" height="118" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="78" y="26" text-anchor="middle" fill="#a78bfa" font-size="15" font-weight="700">judge ⚖</text>
    <text x="78" y="48" text-anchor="middle" fill="#94a3b8" font-size="10">replay · lustro · pułapki</text>
    <text x="78" y="64" text-anchor="middle" fill="#94a3b8" font-size="10">AI wybiera cele,</text>
    <text x="78" y="79" text-anchor="middle" fill="#94a3b8" font-size="10">nigdy nie ferruje wyroków</text>
    <text x="78" y="101" text-anchor="middle" fill="#c4b5fd" font-size="10">werdykty → trust_events</text>
  </g>

  <!-- ==================== INFRA DEVA ==================== -->
  <rect x="686" y="130" width="204" height="290" rx="18" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="788" y="156" text-anchor="middle" fill="#f87171" font-size="14" font-weight="600">infrastruktura dewelopera</text>
  <g transform="translate(710,176)">
    <rect width="156" height="104" rx="12" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
    <text x="78" y="28" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="700">serwis logiki gry</text>
    <text x="78" y="50" text-anchor="middle" fill="#94a3b8" font-size="10">bezstanowe HTTP</text>
    <text x="78" y="66" text-anchor="middle" fill="#94a3b8" font-size="10">init · resolve · annotate</text>
    <text x="78" y="88" text-anchor="middle" fill="#94a3b8" font-size="10">dowolny język / SDK TS</text>
  </g>
  <g transform="translate(710,300)">
    <rect width="156" height="96" rx="12" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
    <text x="78" y="26" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="700">aplikacja UI gry</text>
    <text x="78" y="48" text-anchor="middle" fill="#94a3b8" font-size="10">ranked: bundle u nas (CSP)</text>
    <text x="78" y="64" text-anchor="middle" fill="#94a3b8" font-size="10">casual: self-hosted</text>
    <text x="78" y="82" text-anchor="middle" fill="#94a3b8" font-size="10">token scoped do meczu</text>
  </g>

  <!-- ==================== STRZAŁKI ==================== -->
  <!-- gracze -> gate -->
  <line x1="132" y1="205" x2="246" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="132" y1="415" x2="240" y2="270" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="186" y="196" text-anchor="middle" fill="#94a3b8" font-size="10">WSS: komendy</text>
  <text x="186" y="330" text-anchor="middle" fill="#94a3b8" font-size="10" transform="rotate(-38 178,352)">+ subskrypcje</text>
  <!-- gate -> games -->
  <line x1="380" y1="200" x2="448" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="414" y="191" text-anchor="middle" fill="#94a3b8" font-size="10">HTTP</text>
  <!-- games -> mongo -->
  <line x1="452" y1="290" x2="368" y2="352" stroke="#4ade80" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="428" y="330" text-anchor="middle" fill="#4ade80" font-size="10">projekcje</text>
  <!-- mongo -> gate -->
  <line x1="310" y1="336" x2="310" y2="274" stroke="#4ade80" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="303" y="308" text-anchor="end" fill="#4ade80" font-size="10">change streams</text>
  <!-- games -> serwis logiki -->
  <line x1="608" y1="212" x2="706" y2="220" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrA)"/>
  <text x="658" y="203" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">POST /resolve — podpisane,</text>
  <text x="658" y="238" text-anchor="middle" fill="#fde68a" font-size="9.5">dopiero po zamknięciu fazy</text>
  <!-- judge -> serwis logiki -->
  <line x1="608" y1="400" x2="712" y2="272" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="700" y="348" text-anchor="middle" fill="#a78bfa" font-size="10" transform="rotate(-51 680,342)">audyty — nieodróżnialne od produkcji</text>

  <!-- podpis -->
  <g transform="translate(230,528)">
    <rect x="0" y="-18" width="460" height="30" rx="15" fill="#1e293b" stroke="#fbbf24"/>
    <text x="230" y="2" text-anchor="middle" fill="#fde68a" font-size="12">🔒 żaden ruch nie opuszcza platformy przed zamknięciem fazy planowania</text>
  </g>
</svg>
